name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 内容完整性：步骤齐全、验收项完整、参考数据都带官方来源
      - run: npm run content:validate
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          # 尚未绑定自定义域名时，在仓库 Variables 里设 BASE_PATH=/topicatlas、
          # SITE_CUSTOM_DOMAIN=false，即可正常跑在 <user>.github.io/<repo>/ 下；
          # 绑好域名后把这两个变量删掉即可。
          BASE_PATH: ${{ vars.BASE_PATH }}
          SITE_CUSTOM_DOMAIN: ${{ vars.SITE_CUSTOM_DOMAIN }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
